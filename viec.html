<script>
(() => {
  const CFG = Object.assign({ json: "3d/viec.json", ghi: null, xem: "3d/xem.html", goc: "3d/xem.html?m=nha" }, window.VIEC_CFG || {});
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...con) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "class") e.className = v;
      else if (k === "value") e.value = v;
      else if (k === "html") e.innerHTML = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of con.flat()) if (c != null && c !== false) e.append(c);
    return e;
  };
  const giau = (s) => { const t = document.createElement("template");
    t.innerHTML = String(s || "").replace(/<(?!\/?(strong|em)\b)[^>]*>/g, "");
    return t.content; };
  const khongDau = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  const slug = (s) => khongDau(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  const MA = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  const sao = (x) => JSON.parse(JSON.stringify(x));
  $("nut-x").href = "#";                                          
  const DT = matchMedia("(max-width: 899px)");                    
  const TEN_MUC = { "yeu-cau": "yêu cầu", "goi-y": "gợi ý" };
  const muc = (l) => (l === "goi-y" ? "goi-y" : "yeu-cau");
  const TEN_BUOC = { tach: "Tách lớp", camera: "Bay camera", noi_bat: "Làm nổi", cho: "Chờ", noi_len: "Xem rời" };

  const xem = h("iframe", { id: "xem", title: "Mô hình 3D" });
  $("o-xem").append(xem);
  const batXem = () => { if (!xem.getAttribute("src")) xem.src = CFG.xem + "?m=nha&nhung=1&khong_the=1&v=b736cd01bdc5"; };
  let sanSang = false, soHoi = 0;
  const hang = [], cho = new Map();
  const tatXem = () => { if (!xem.getAttribute("src")) return; xem.src = "about:blank"; xem.removeAttribute("src"); sanSang = false; hang.length = 0; };
  const gui = (m) => (sanSang ? xem.contentWindow.postMessage({ nguon: "khung3d", ...m }, "*") : hang.push(m));
  const hoi = (lenh, them = {}) => new Promise((r) => { const id = ++soHoi; cho.set(id, r); gui({ lenh, hoi: id, ...them }); });
  addEventListener("message", (ev) => {
    if (ev.source !== xem.contentWindow && ev.origin !== location.origin) return;
    const d = ev.data || {};
    if (d.nguon !== "xem3d") return;
    if (d.lenh === "san_sang") {
      sanSang = true;
      if (sua) xem.contentWindow.postMessage({ nguon: "khung3d", lenh: "sua", bat: true }, "*");
      for (const m of hang.splice(0)) gui(m);
    } else if (d.lenh === "trang_thai" || d.lenh === "chon" || d.lenh === "kich_ban_xong" || d.lenh === "da_ap" || d.lenh === "ban_ve" || d.lenh === "bo_phan") {
      const f = cho.get(d.hoi); if (f) { cho.delete(d.hoi); f(d.lenh === "chon" || d.lenh === "bo_phan" ? d.ds : d.lenh === "trang_thai" ? d.tt : d.lenh === "ban_ve" ? d.kq : d.xong); } }
    else if (d.lenh === "tien_do") { $("tien-i").style.width = (d.pct * 100).toFixed(1) + "%"; if (!daHienXong) $("tien-chu").textContent = d.chu; }
    else if (d.lenh === "loi") { $("dang-tai").hidden = false; $("tien-chu").textContent = "Không tải được mô hình 3D: " + d.loi; }
  });
  let ttCuoi = "", ttDang = {}, goc = null, daHien = false, daHienXong = false;
  const tachDe = null;                 
  let kichThuoc = true;
  const chiBa = (tt) => !!tt && tt.ban_ve === false;
  const laTran = (v) => !!v && /^(tran-|ban-do-den$|vach-dau-thang$|ban-ve-)/.test(v.so_do || "");
  const TRANG_DAI = new Set(["ban-ve-mat-tien", "ban-ve-san-truoc", "ban-ve-cua-ngoai", "ban-ve-cua-di", "ban-ve-cua-phong-lam-viec", "ban-ve-cau-thang",
    "ban-ve-gach", "ban-ve-epoxy", "ban-ve-wc-tang-2", "ban-ve-bep", "ban-ve-gieng-troi", "ban-ve-khac", "ban-ve-dien-mang"]);   
  const laCuon = (v) => !!v && /^ban-ve-/.test(v.so_do || "");   
  let viecDang = null;
  const banVeBat = (tt = goc && goc.tt) => kichThuoc && !sua && !chiBa(tt) && !laTran(viecDang) && !document.body.classList.contains("ml");   
  const HUONG_BV = [[null, "Tự chọn mặt nhìn"], ["y-", "Nhìn từ Tây Bắc"], ["x+", "Nhìn từ Tây Nam"], ["y+", "Nhìn từ Đông Nam"],
    ["x-", "Nhìn từ Đông Bắc"], ["z+", "Nhìn từ trên xuống"]];
  const laTrangCua = () => !!viecDang && CUA_VIEC.has(viecDang.id) && !sua;
  const GOC_DUNG = { ten: "Mặt đứng" };
  let gocCua = [GOC_DUNG], cuaDang = null;
  const dsGoc = () => (laTrangCua() ? gocCua : HUONG_BV.map(([huong, ten]) => ({ ten, huong })));
  let iHuong = 0;
  const gocBV = () => {
    const g = dsGoc()[iHuong] || dsGoc()[0];

  const doiHuong = (b) => {

      const bp = new Map((ds || []).map((x) => [x.ten, x.ids]));

      gocCua = [GOC_DUNG,
        ...(bp.has("Chỉ phào") ? [{ ten: "Chỉ phào — mặt cắt", chi: bp.get("Chỉ phào"), bp: "Chỉ phào", huong: "z+", cat: true }] : []),
        ...(bp.has("Lam chân") ? [{ ten: "Lam chân", chi: bp.get("Lam chân"), bp: "Lam chân" }] : []),
        ...(bp.has("Khoá và tay nắm") ? [{ ten: "Tay nắm và khoá", chi: bp.get("Khoá và tay nắm"), bp: "Khoá và tay nắm", vi_tri: true }] : [])];
      veTenHuong();
    });
  }
  $("bv-truoc").onclick = () => doiHuong(-1);
  $("bv-sau").onclick = () => doiHuong(1);
  $("bv-ten").onclick = () => doiHuong(1);
  const veNutKt = () => {
    veTenHuong();
    $("huong-bv").hidden = !banVeBat();
    const b = $("nut-kt"), bv = banVeBat();

          nutNho("↓ Xuống", () => { doiCho(ds, i, i + 1); veLai(); }, { tat: i === ds.length - 1 }),
          nutNho("→ Vào mục trên", () => { (ds[i - 1].con = ds[i - 1].con || []).push(m); ds.splice(i, 1); veLai(); },
            { tat: i === 0, title: "Thành mục con cuối của mục ngay trên" }),
          nutNho("← Ra ngoài", () => { cha.ds.splice(cha.i + 1, 0, m); ds.splice(i, 1); if (!ds.length) delete cha.ds[cha.i].con; veLai(); },
            { tat: !cha, title: "Ra một cấp, đứng ngay sau mục cha" })),
        h("div", { class: "dong hang-nut" },
          nutNho("＋ Mục con", () => { const c = mucMoi(); (m.con = m.con || []).push(c); doi(v, true); di(v, c); }, { lop: "to-mau" }),
          nutNho("⧉ Nhân bản", () => {
            const b = sao(m); b.ten = m.ten + " — bản sao";
            for (const [, c] of duyet([b])) { let x = idMoi(c.id.replace(/-[a-z0-9]{5,6}$/, "").slice(0, 30).replace(/-+$/, "")); while (tim(v, x)) x = idMoi(c.id); c.id = x; }
            ds.splice(i + 1, 0, b); doi(v, true); di(v, b); }, { title: "Chép mục này (kể cả mục con) đặt ngay dưới" }),
          nutNho("Xoá mục", () => {
            if (confirm(`Xoá mục «${m.ten}»${(m.con || []).length ? " và mọi mục con" : ""}? (hoàn tác được bằng ↶)`)) { ds.splice(i, 1); doi(v, true); di(v, null); } }, { lop: "xoa" })),
        truong("Địa chỉ mục (sau dấu /)", oId)));
  }

  let banChep = null;
  try { banChep = JSON.parse(localStorage.getItem("viec3d:chep") || "null"); } catch (_) {   }
  function chepGoc(m) {
    banChep = sao({ ten: m.ten, tt: m.tt || null, bay: m.bay, kich_ban: m.kich_ban || null });
    try { localStorage.setItem("viec3d:chep", JSON.stringify(banChep)); } catch (_) {   }
    ve(); bao(`Đã chép góc của «${m.ten}» — mở mục khác rồi bấm Dán góc`);
  }
  function danGoc(v, m, giuNoi) {
    if (!banChep) return;
    const noiCu = m.tt && m.tt.noi_bat;
    const b = sao(banChep);
    if (b.tt) m.tt = b.tt; else delete m.tt;
    if (giuNoi) { if (!m.tt) m.tt = {}; if (noiCu) m.tt.noi_bat = noiCu; else delete m.tt.noi_bat; }
    if (b.bay != null) m.bay = b.bay; else delete m.bay;
    if (b.kich_ban) {
      m.kich_ban = b.kich_ban;
      if (giuNoi) for (const x of m.kich_ban) if (x.buoc === "noi_bat") x.ds = [...(noiCu || [])];
    } else delete m.kich_ban;
    doi(v, true); ttCuoi = ""; ve();
    bao(`Đã dán góc của «${banChep.ten}»${giuNoi ? " (giữ ★ của mục)" : ""} — nhớ Lưu`);
  }

  function suaKichBan(v, m, veLai, d) {
    const kb = m.kich_ban || [];
    const them = async (buoc) => {
      const b = { buoc };
      if (buoc === "tach") Object.assign(b, { khe: 0.25, giay: 0.8 });
      else if (buoc === "camera") Object.assign(b, { v: (await hoi("lay")).v, giay: 1 });
      else if (buoc === "noi_bat") b.ds = [...((m.tt && m.tt.noi_bat) || [])];
      else if (buoc === "cho") b.giay = 0.5;
      else if (buoc === "noi_len") { const c = await hoi("chon"); b.ds = (c || []).map((x) => x.id); b.khe = 0.5; b.giay = 0.8;
        if (!b.ds.length) bao("Bước «Xem rời» cần các bộ phận của cấu kiện: Shift+bấm chọn chúng trong khung 3D rồi bấm «⤓ Vật đang chọn».", true); }
      (m.kich_ban = m.kich_ban || []).push(b); veLai();
    };
    const tuGoc = async () => {
      const tt = m.tt || (m.tt = await hoi("lay"));
      m.kich_ban = [{ buoc: "tach", khe: tt.tach || 0, giay: 0.8 }, { buoc: "camera", v: tt.v, giay: m.bay ?? 0.8 }];
      if ((tt.noi_bat || []).length) m.kich_ban.push({ buoc: "noi_bat", ds: [...tt.noi_bat] });
      veLai();
    };
    const chay = () => { ttCuoi = ""; apGoc(m.tt || v.mac_dinh, m.bay, m.kich_ban, `sua|${v.id}|${m.id}`); };
    const so = (b, k, nhan, max) => h("label", { class: "chon-ok" }, nhan,
      h("input", { type: "number", class: "o so-nho", min: 0, max, step: 0.05, value: b[k] ?? 0, "aria-label": nhan, oninput: (e) => { b[k] = Number(e.target.value); d(); } }));
    const dong = kb.map((b, j) => {
      const noi = [];
      if (b.buoc === "tach") noi.push(h("div", { class: "hang-sua" }, so(b, "khe", "Khe", 0.6), h("span", { class: "don-vi" }, "m"), so(b, "giay", "trong", 10), h("span", { class: "don-vi" }, "giây")));
      else if (b.buoc === "camera") noi.push(
        h("div", { class: "hang-sua" }, nutNho("⤓ Lấy camera hiện tại", async () => { b.v = (await hoi("lay")).v; dongBo(); veLai(); bao("Đã lấy camera cho bước " + (j + 1)); }, { lop: "to-mau" }),
          so(b, "giay", "trong", 10), h("span", { class: "don-vi" }, "giây")),
        h("div", { class: "v" }, b.v || "chưa có góc"));
      else if (b.buoc === "noi_bat") noi.push(
        h("div", { class: "hang-sua" },
          nutNho("⤓ Lấy ★ của mục", () => { b.ds = [...((m.tt && m.tt.noi_bat) || [])]; veLai(); }),
          nutNho("★ Vật đang chọn", async () => { const c = await hoi("chon"); if (!c || !c.length) return bao("Bấm chọn vật trong khung 3D trước.", true);
            for (const x of c) tenNoi.set(x.id, x.ten); b.ds = [...new Set([...(b.ds || []), ...c.map((x) => x.id)])]; veLai(); }),
          nutNho("∅ Bỏ hết", () => { b.ds = []; veLai(); }, { lop: "xoa", title: "Bước này tắt làm nổi — mọi vật hiện bình thường" })),
        chipNoi(v, m, b.ds || [], (x) => { b.ds = x; }, true));
      else if (b.buoc === "cho") noi.push(h("div", { class: "hang-sua" }, so(b, "giay", "Chờ", 10), h("span", { class: "don-vi" }, "giây")));
      else if (b.buoc === "noi_len") noi.push(
        h("div", { class: "hang-sua" },
          nutNho("⤓ Vật đang chọn", async () => { const c = await hoi("chon"); if (!c || !c.length) return bao("Shift+bấm chọn các bộ phận trong khung 3D trước.", true);
            b.ds = c.map((x) => x.id); d(); veLai(); }),
          so(b, "khe", "Tách rời", 1), so(b, "giay", "trong", 10), h("span", { class: "don-vi" }, "giây")),
        h("div", { class: "v" }, (b.ds || []).length ? b.ds.length + " bộ phận: " + b.ds.join(", ") : "chưa chọn bộ phận"));
      return h("div", { class: "buoc-kb" }, h("span", { class: "stt" }, String(j + 1)),
        h("div", {}, h("div", { class: "hang-sua" }, h("strong", {}, TEN_BUOC[b.buoc] || b.buoc), h("span", { class: "gian" }),
          nutNho("↑", () => { doiCho(kb, j, j - 1); veLai(); }, { lop: "bieu", tat: j === 0, nhan: "Lên" }),
          nutNho("↓", () => { doiCho(kb, j, j + 1); veLai(); }, { lop: "bieu", tat: j === kb.length - 1, nhan: "Xuống" }),
          nutNho("✕", () => { kb.splice(j, 1); if (!kb.length) delete m.kich_ban; veLai(); }, { lop: "bieu xoa", nhan: "Xoá bước" })), ...noi));
    });
    return nhomGap("kich-ban|" + m.id, "Kịch bản chuyển động", kb.length ? kb.length + " bước" : "mặc định",
      kb.length ? "Mở mục: cảnh nền (góc đã chụp, trừ camera và khe tách) đặt ngay, rồi các bước chạy lần lượt từ trên xuống."
        : "Chưa có kịch bản — mục chạy mặc định: tách lớp → bay camera tới góc đã chụp → làm nổi.",
      ...dong,
      h("div", { class: "dong hang-nut" },
        ...Object.entries(TEN_BUOC).map(([k, x]) => nutNho("＋ " + x, () => them(k), { lop: "to-mau" }))),
      h("div", { class: "dong hang-nut" },
        kb.length ? nutNho("▶ Chạy", chay, { lop: "chinh", title: "Chạy kịch bản từ đầu trong khung 3D" }) : nutNho("Tạo từ góc đã chụp", tuGoc, { title: "Ba bước: tách → camera → làm nổi, lấy từ góc của mục" }),
        kb.length ? nutNho("Xoá kịch bản", () => { delete m.kich_ban; veLai(); }, { lop: "xoa" }) : null));
  }

  function dongBoKb(m) {
    const kb = m.kich_ban || [], tt = m.tt || {};
    const cuoi = (buoc) => kb.filter((b) => b.buoc === buoc).pop();
    const c = cuoi("camera"), t = cuoi("tach"), n = cuoi("noi_bat");
    if (c && tt.v) c.v = tt.v;
    if (t) t.khe = Number(tt.tach) || 0;
    if (n) n.ds = [...(tt.noi_bat || [])];
  }
  const tenNoi = new Map();
  async function batNoi(v, m, theoLop) {
    const ds = await hoi("chon");
    if (!ds || !ds.length) { bao("Bấm chọn một vật trong khung 3D trước (Shift+bấm để chọn nhiều), rồi bấm ★.", true); return; }
    if (!m.tt) m.tt = await hoi("lay");
    const cu = new Set(m.tt.noi_bat || []);
    const khoa = [...new Set(ds.map((x) => (theoLop ? x.nhom : x.id)))];
    for (const x of ds) tenNoi.set(theoLop ? x.nhom : x.id, theoLop ? x.nhom : x.ten);
    const coHet = khoa.every((k) => cu.has(k));
    for (const k of khoa) coHet ? cu.delete(k) : cu.add(k);
    m.tt.noi_bat = [...cu];
    if (!m.tt.noi_bat.length) delete m.tt.noi_bat;
    dongBoKb(m);
    await hoi("noi_bat_dat", { ds: m.tt.noi_bat || [] });
    dongBo(); ttDang = m.tt;
    doi(v, true); ve();
    bao(coHet ? `Đã bỏ ${khoa.length} khỏi danh sách làm nổi` : `Đã làm nổi ${khoa.length} ${theoLop ? "lớp" : "vật"} — nhớ Lưu`);
  }
  function chipNoi(v, m, ds, dat, laBuoc) {
    if (!ds.length) return h("div", { class: "trong" }, laBuoc ? "Bước này tắt làm nổi." : "Chưa làm nổi gì — chọn vật trong 3D rồi bấm ★.");
    return h("div", {}, ds.map((k) => h("span", { class: "chip", title: k }, (tenNoi.get(k) || k).slice(0, 48),
      h("button", { type: "button", "aria-label": "Bỏ", onclick: async () => {
        const con = ds.filter((x) => x !== k);
        if (laBuoc) { dat(con); doi(v, true); ve(); return; }
        dat(con); if (!m.tt.noi_bat.length) delete m.tt.noi_bat; dongBoKb(m);
        await hoi("noi_bat_dat", { ds: m.tt.noi_bat || [] }); dongBo(); ttDang = m.tt; doi(v, true); ve(); } }, "✕"))));
  }

  function viecMoi() {
    const ten = (prompt("Tên việc mới (vd «Bếp — tủ, đá, thoát khói»):") || "").trim();
    if (!ten) { ve(); return; }
    let id = slug(ten.split(" — ")[0]) || "viec";
    while (VIEC.some((x) => x.id === id)) id += "-2";
    const v = { id, ten, muc: [mucMoi()] };
    VIEC.push(v); moiTao.add(id); moc.set(id, JSON.stringify(v));
    ban.add(id); veLuu();
    location.hash = "#" + id;
    bao(`Đã tạo việc «${ten}» (địa chỉ #${id}) — nhớ Lưu`);
  }

  $("nut-sua").onclick = () => {
    sua = !sua;
    document.body.classList.toggle("dang-sua", sua);
    $("nut-sua").setAttribute("aria-pressed", String(sua));
    $("nut-sua").textContent = sua ? "✓ Xong" : "✎ Sửa";
    veNutKt();
    if (sanSang) xem.contentWindow.postMessage({ nguon: "khung3d", lenh: "sua", bat: sua }, "*");
    veLuu(); ve();
  };
  $("nut-luu").onclick = async () => {
    chotHen();
    $("nut-luu").disabled = true; $("nut-luu").textContent = "Đang lưu…";
    const canhBao = [];
    for (const id of [...ban]) {
      const v = VIEC.find((x) => x.id === id);
      if (!v) { ban.delete(id); continue; }
      let kq;
      try { kq = await (await fetch(`${CFG.ghi}?viec=${encodeURIComponent(id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(v) })).json(); }
      catch (e) { kq = { ok: false, loi: String(e) }; }
      if (!kq.ok) { veLuu(); bao("Không lưu được: " + kq.loi, true); return; }
      ban.delete(id); moiTao.delete(id); canhBao.push(...(kq.canh_bao || []));
    }
    await nap(); veLuu(); ve();
    bao(canhBao.length ? `Đã lưu — ⚠ ${canhBao.length} câu chưa đạt luật hồ sơ: ${canhBao[0]}` : "Đã lưu vào data/viec-3d.yaml", canhBao.length > 0);
  };
  addEventListener("beforeunload", (e) => { if (ban.size) { e.preventDefault(); e.returnValue = ""; } });
  addEventListener("keydown", (e) => {
    if ((e.key === "Delete" || e.key === "Backspace") && SD.den && SD.chonDen && CFG.ghi_den && !e.metaKey && !e.ctrlKey
        && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName) && !(document.activeElement || {}).isContentEditable) {
      e.preventDefault(); xoaDen(SD.chonDen); return;
    }
    if (!(e.metaKey || e.ctrlKey)) return;
    const k = e.key.toLowerCase();
    if (k === "s" && ban.size) { e.preventDefault(); $("nut-luu").click(); }
    else if (k === "z" && sua && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)) { e.preventDefault(); hoanTac(e.shiftKey); }
  });

  async function nap() {
    const d = await (await fetch(CFG.json, { cache: "no-cache" })).json();
    const giu = VIEC.filter((v) => moiTao.has(v.id));
    VIEC = (d.viec || []).concat(giu); NT = d.nghiem_thu || [];
    coNT = !!NT.length || VIEC.some((v) => [...duyet(v.muc)].some(([, m]) => (m.nghiem_thu || []).length));   
    for (const v of VIEC) { v.muc = v.muc || []; if (!ban.has(v.id)) moc.set(v.id, JSON.stringify(v)); }
  }
  if (CFG.ghi) $("nut-sua").hidden = false;
  if (location.hash.length < 2) try {
    const c = JSON.parse(localStorage.getItem(KHOA_ML) || "null");
    if (c && c.ds && c.ds.length > 1) veMucLuc(c.ds, c.nt);
  } catch {}
  if (/^#(mat-tien|doc-vespa)(\/|$)/.test(location.hash)) document.body.classList.add("trang-dai");   
  if (/^#chieu-sang(\/|$)/.test(location.hash)) { document.body.classList.add("den-trang"); $("than").replaceChildren(h("p", { class: "trong" }, "Đang tải sơ đồ đèn…")); taiDen().catch(() => {}); }
  nap().then(() => {
    daNap = true;
    try { localStorage.setItem(KHOA_ML, JSON.stringify({ ds: dsMl(), nt: coNT })); } catch {}
    ve();
  }).catch((e) => { $("than").textContent = "Không đọc được dữ liệu việc: " + e; });
})();
</script>
</body>
</html>
