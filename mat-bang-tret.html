<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="utf-8">

<title>Mặt bằng trệt — 383 Hải Phòng</title>
<style>
  body { margin: 0; padding: 20px; background: #efe9d8; font-family: 'Helvetica', sans-serif; display: flex; justify-content: center; }
  .sheet { background: #fdfbf3; padding: 24px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); border: 1px solid #c8bf9d; }
  h1 { font-size: 16px; letter-spacing: 3px; margin: 0 0 4px 0; font-weight: 600; color: #222; }
  .scale { font-size: 12px; color: #666; margin-bottom: 14px; letter-spacing: 1.5px; }
  svg { display: block; }

  .lot-outline { fill: #fdfbf3; stroke: #1a1a1a; stroke-width: 60; stroke-linejoin: miter; }
  .interior-wall { fill: #1a1a1a; }
  .room-fill-1 { fill: #f4ead0; }
  .room-fill-2 { fill: #e8e0c4; }
  .room-fill-3 { fill: #f0e6cc; }
  .room-fill-5 { fill: #ece2c6; }
  .wet-fill { fill: #d8e4e8; }
  .stair-fill { fill: #e0d5b8; }

  .room-label { font-family: 'Helvetica', sans-serif; font-size: 200px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; letter-spacing: 8px; }
  .room-sub { font-family: 'Helvetica', sans-serif; font-size: 130px; font-weight: 600; fill: #2a4a55; text-anchor: middle; letter-spacing: 4px; }

  .furn { fill: none; stroke: #3a3a3a; stroke-width: 14; stroke-linejoin: round; }
  .furn-fill { fill: #c8bb96; stroke: #3a3a3a; stroke-width: 14; }
  .furn-light { fill: #e8dfc0; stroke: #3a3a3a; stroke-width: 12; }
  .fixture { fill: #fff; stroke: #3a3a3a; stroke-width: 12; }

  .door-arc { fill: none; stroke: #888; stroke-width: 10; stroke-dasharray: 30 20; }
  .door-leaf { stroke: #3a3a3a; stroke-width: 14; }

  .dim-line { stroke: #b0392b; stroke-width: 8; fill: none; }
  .dim-tick { stroke: #b0392b; stroke-width: 8; }
  .dim-text { font-family: 'Helvetica', sans-serif; font-size: 150px; fill: #b0392b; text-anchor: middle; font-weight: 600; }

  .axis-circle { fill: #fdfbf3; stroke: #b0392b; stroke-width: 10; }
  .axis-text { font-family: 'Helvetica', sans-serif; font-size: 180px; fill: #b0392b; text-anchor: middle; dominant-baseline: central; font-weight: 700; }
  .axis-line { stroke: #b0392b; stroke-width: 5; stroke-dasharray: 80 30 15 30; }
  .center-line { stroke: #b0392b; stroke-width: 5; stroke-dasharray: 100 40 15 40; }

  .stair-tread { stroke: #3a3a3a; stroke-width: 10; fill: none; }
  .roof-edge { fill: none; stroke: #999; stroke-width: 10; stroke-dasharray: 25 18; }

  /* Bản vẽ đặt cứng width="640" trên nền body flex — trên màn 390px nó đẩy
     trang rộng 548px và mép phải bị cắt. Cho tờ vẽ co lại theo màn, và bản vẽ
     giữ tỉ lệ bằng viewBox. */
  @media (max-width: 900px) {
    body { padding: 10px; display: block; }
    .sheet { padding: 14px 12px; }
    .sheet svg { width: 100%; height: auto; max-width: 640px; }
  }
</style>
</head>
